name: Handbook

# Published with each release, so the handbook describes the image operators can run; CI calls it
# after tagging. By hand for a docs fix that should not wait for the next release.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: make handbook
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
