name: CI

# Pull requests run the checks. A push to main runs them and then releases; a push without
# `feat` or `fix` since the last tag releases nothing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Reads `engines.node`.
          node-version-file: app/package.json
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci
      - run: make lint
      - run: make test
      # `make e2e` downloads Chromium, not the system libraries it needs.
      - run: npx playwright install-deps chromium
        working-directory: app
      - run: make e2e

  release:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Two quick pushes must not both try to tag the same version.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release reads every commit since the last tag.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/package.json
      # Before semantic-release, which pushes the image while preparing the release.
      - run: echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      # ponytail: npx without a lockfile, so the plugins float within their ^ ranges; pin them in a root package.json with a lockfile if a release ever breaks from it.
      - run: npx --package semantic-release@25.0.9 --package @semantic-release/exec@7.1.0 semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}
